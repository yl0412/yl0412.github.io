<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>麦克风权限申请</title>
    <!-- <script src="./vconsole.min.js"></script> -->
    <!-- <script>
      var vConsole = new window.VConsole();
    </script> -->
    <script src="./eruda.min.js"></script>
    <script>
      eruda.init();
    </script>
  </head>
  <body>
    <h1>2025-10-10 20:34:44</h1>
    <div>
      <label>
        <input type="checkbox" id="audioCheckbox" checked />
        麦克风权限
      </label>
    </div>
    <div>
      <label>
        <input type="checkbox" id="videoCheckbox" />
        摄像头权限
      </label>
    </div>
    <button id="mediaButton">获取媒体权限</button>
    <div id="status"></div>
    <div id="ua" style="word-break: break-all; margin-top: 12px; color: #555;"></div>

    <script>
      const audioCheckbox = document.getElementById('audioCheckbox');
      const videoCheckbox = document.getElementById('videoCheckbox');
      const mediaButton = document.getElementById('mediaButton');
      const statusDiv = document.getElementById('status');
      document.getElementById('ua').textContent = `当前 UA：${navigator.userAgent}`;

      mediaButton.addEventListener('click', async () => {
        const audioEnabled = audioCheckbox.checked;
        const videoEnabled = videoCheckbox.checked;

        if (!audioEnabled && !videoEnabled) {
          statusDiv.textContent = '请至少选择一个权限';
          statusDiv.style.color = 'orange';
          return;
        }

        try {
          // 根据选择的权限请求媒体设备
          const constraints = {
            audio: audioEnabled,
            video: videoEnabled,
          };

          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          console.log(`\x1B[1m\x1B[32m[🐑🐑🐑][2025-06-03 18:52:55] stream-->`, stream, stream.getTracks());

          statusDiv.textContent = `权限已授予 ✅ 音频: ${audioEnabled ? '是' : '否'}, 视频: ${videoEnabled ? '是' : '否'}`;
          statusDiv.style.color = 'green';
        } catch (error) {
          statusDiv.textContent = `权限被拒绝：${error.message}`;
          statusDiv.style.color = 'red';
        }
      });
    </script>
  </body>
</html>
